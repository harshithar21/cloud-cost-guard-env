[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud_cost_guard_env"
version = "0.1.0"
description = "A Kubernetes FinOps RL environment"
authors = [{name = "Your Name"}]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.0.0",
    "websockets>=12.0",
    "openenv-core @ git+https://github.com/meta-pytorch/OpenEnv.git"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cloud_cost_guard_env*"]